[package]
name = "ascii_web"
version = "0.1.0"
edition = "2021"
description = "Zoa Hickenlooper's personal website (zoa.sh)"
repository = "https://github.com/vxfemboy/zoa.sh"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1"
config = "0.15.18"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
actix = "0.13"
actix-web = "4.11.0"
actix-files = "0.6.8"
actix-web-actors = "4.2.0"
tera = "1"
rand = "0.9.2"
tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = "0.3"
tracing-actix-web = "0.7"
monochora = "0.1.8"
image = "0.25.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
lru = "0.12"
once_cell = "1.19"
pulldown-cmark = "0.10"
syntect = "5.2"
# Pinned: time 0.3.48 adds a From impl that collides with cookie 0.16.2's
# blanket impl (E0119); actix-web 4.x is locked to cookie 0.16. 0.3.47 is the
# highest version that still satisfies plist's `^0.3.47` requirement.
time = "=0.3.47"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlPreElement",
    "Window",
    "Location",
    "MouseEvent",
    "console",
    "CssStyleDeclaration",
    "Node",
    "Request",
    "Response",
    "RequestInit",
    "RequestMode",
    "Headers",
    "WebSocket",
    "MessageEvent",
    "EventTarget",
    "Event",
    "DomRect"
] }
js-sys = "0.3"

[dev-dependencies]
cargo-watch = "8.5"