[package]
name = "ascii_web"
version = "0.1.0"
edition = "2021"
description = "A modern Rust-powered website with ASCII art and interactive WASM elements"
repository = "https://github.com/yourusername/sadsite"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
config = "0.14"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
actix-web = "4.11.0"
actix-files = "0.6.8"
tera = "1"
rand = "0.9.2"
unicode-width = "0.2.2"
tokio = { version = "1.48.0", features = ["full"] }
tracing-subscriber = "0.3"
tracing-actix-web = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlPreElement",
    "Window",
    "MouseEvent",
    "console",
    "CssStyleDeclaration",
    "Node",
    "Request",
    "Response",
    "RequestInit",
    "RequestMode",
    "Headers"
] }
js-sys = "0.3"

[dev-dependencies]
cargo-watch = "8.5"