[package]
name = "zoa-sh"
version = "0.1.0"
edition = "2021"
description = "Zoa Hickenlooper's website (zoa.sh)"
repository = "https://github.com/vxfemboy/zoa.sh"
license = "MIT"
# The server is the default binary; `gen-avatar` is an opt-in helper
# (`cargo run --bin gen-avatar`).
default-run = "zoa-sh"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
config = "0.15.23"
chrono = { version = "0.4.45", features = ["serde"] }
unicode-width = "0.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
actix-web = "4.13.0"
actix-files = "0.6.10"
tera = "1.20.1"
rand = "0.10.1"
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = "0.3.23"
tracing-actix-web = "0.7.21"
monochora = "0.1.8"
image = "0.25.8"
# Used only by the `gen-avatar` helper binary to fetch the GitHub avatar; already
# present transitively via monochora, so no extra build cost.
reqwest = { version = "0.11", features = ["blocking"] }
scraper = "0.27"
csscolorparser = "0.7"
regex = "1"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
lru = "0.18"
once_cell = "1.21.4"
pulldown-cmark = "0.13.4"
syntect = "5.3.0"
# Pinned: time 0.3.48 adds a From impl that collides with cookie 0.16.2's blanket
# impl (E0119). actix-web 4.x hard-requires cookie 0.16, so time cannot advance
# past 0.3.47 (also the highest version satisfying plist's `^0.3.47`). Do not bump.
time = "=0.3.47"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"
wasm-bindgen-futures = "0.4.73"
web-sys = { version = "0.3.100", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlPreElement",
    "Window",
    "Location",
    "MouseEvent",
    "console",
    "CssStyleDeclaration",
    "Node",
    "Request",
    "Response",
    "RequestInit",
    "RequestMode",
    "Headers",
    "EventTarget",
    "Event",
    "DomRect",
    "NodeList"
] }
js-sys = "0.3.100"

[dev-dependencies]
cargo-watch = "8.5.3"
