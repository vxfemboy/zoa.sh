[package]
name = "ascii_web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
actix-web = "4.11.0"
actix-files = "0.6.8"
tera = "1"
rand = "0.9.2"
unicode-width = "0.2.2"
tokio = { version = "1.48.0", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.104"
wasm-bindgen-futures = "0.4.54"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlPreElement",
    "Window",
    "MouseEvent",
    "console",
    "CssStyleDeclaration",
    "Node",
    "Request",
    "Response",
    "RequestInit",
    "RequestMode",
    "Headers"
] }
js-sys = "0.3"